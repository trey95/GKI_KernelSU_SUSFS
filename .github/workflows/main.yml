  release:
    runs-on: ubuntu-latest
    # always() so a skipped sibling doesn't cascade: on a single-family
    # dispatch the other six build jobs skip, and a skipped need skips
    # this job too, making Pre-Release/Release unreachable outside a
    # full 7-family run. The contains() checks keep a genuinely failed
    # or cancelled build from publishing. needs.* rather than a per-job
    # list so a new family doesn't need editing here.
    if: >-
      always() && !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      !inputs.test_release_notes &&
      (inputs.release_type == 'Pre-Release' || inputs.release_type == 'Release') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    needs:
      - resolve-sources
      - build-android12-5-10
      - build-android13-5-10
      - build-android13-5-15
      - build-android14-5-15
      - build-android14-6-1
      - build-android15-6-6
      - build-android16-6-12
      - build-android17-6-18
      - build-nomount-module
      - publish-manager-artifacts
      - notes-preview

    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Validate Selected Builds
        run: |
          set -euo pipefail

          failed=0
          current_type="${{ inputs.kernel_build_version }}"

          check_selected() {
            local target="$1"
            local job_name="$2"
            local result="$3"
            
            if [[ "$current_type" == "all" || "$current_type" == "$target" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "Required job $job_name did not succeed (result: $result)"
                failed=1
              fi
            fi
          }

          check_selected "5.10.x-android12" "build-android12-5-10" "${{ needs.build-android12-5-10.result }}"
          check_selected "5.10.x-android13" "build-android13-5-10" "${{ needs.build-android13-5-10.result }}"
          check_selected "5.15.x-android13" "build-android13-5-15" "${{ needs.build-android13-5-15.result }}"
          check_selected "5.15.x-android14" "build-android14-5-15" "${{ needs.build-android14-5-15.result }}"
          check_selected "6.1.x-android14" "build-android14-6-1" "${{ needs.build-android14-6-1.result }}"
          check_selected "6.6.x-android15" "build-android15-6-6" "${{ needs.build-android15-6-6.result }}"
          check_selected "6.12.x-android16" "build-android16-6-12" "${{ needs.build-android16-6-12.result }}"
          check_selected "6.18.x-android17" "build-android17-6-18" "${{ needs.build-android17-6-18.result }}"

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3 # Use @main for latest, @v3 for stable
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz" # Use 'rmz' for faster deletion (default: 'rm')
          rmz_version: "3.1.1" # Required when rm_cmd is 'rmz'
          testing: false

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate New Tag
        id: tag
        if: inputs.release_type != 'CI'
        run: |
          mapfile -t RELEASE_TAGS < <(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" --jq '.[].name' 2>/dev/null | grep -E '^r[0-9]+$' || true)

          LATEST_REV=0
          for TAG in "${RELEASE_TAGS[@]}"; do
            REV="${TAG#r}"
            if [[ "$REV" =~ ^[0-9]+$ && "$REV" -gt "$LATEST_REV" ]]; then
              LATEST_REV="$REV"
            fi
          done

          if [[ "$LATEST_REV" -gt 0 ]]; then
            NEW_TAG="r$((LATEST_REV + 1))"
          else
            NEW_TAG="r1"
          fi

          if [[ ${#RELEASE_TAGS[@]} -gt 0 ]]; then
            echo "Latest r-tag: r${LATEST_REV}"
          else
            echo "No existing r-tags found; starting at r1"
          fi
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Set Release Title
        id: release_meta
        run: |
          set -euo pipefail

          # Format release title: convert rN -> Release N
          if [[ "${NEW_TAG}" =~ ^r([0-9]+)$ ]]; then
            REV_NUM="${BASH_REMATCH[1]}"
            release_title="Release ${REV_NUM}"
          else
            release_title="Release ${NEW_TAG}"
          fi

          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"

      - name: Extract KernelSU Version Info
        id: ksu_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
          KSU_INPUT="dev-susfs"

          # Try as branch first, fall back to commit
          if git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
            echo "Cloning KernelSU-Next from branch: $KSU_INPUT"
            git clone --branch "$KSU_INPUT" "$KSU_REPO" /tmp/kernelsu-next
            cd /tmp/kernelsu-next
            KSUN_COMMIT=$(git rev-parse HEAD)
          else
            echo "Cloning KernelSU-Next from dev-susfs branch, then checking out commit: $KSU_INPUT"
            git clone --branch dev-susfs "$KSU_REPO" /tmp/kernelsu-next
            cd /tmp/kernelsu-next
            git fetch --depth=50 origin "$KSU_INPUT"
            git checkout "$KSU_INPUT"
            KSUN_COMMIT="$KSU_INPUT"
          fi

          # The manager is built on the OFFICIAL KernelSU-Next repo
          # (pershoot's workflows are all disabled). Find the official dev
          # commit this fork's branch is synced with (merge-base of our
          # branch vs official dev), then link the manager build run for
          # that commit. pershoot's own dev branch is intentionally ignored.
          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          OFFICIAL_KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
          retry git fetch "$OFFICIAL_KSU_REPO" dev
          STOCK_COMMIT=$(git merge-base HEAD FETCH_HEAD)
          echo "KSU Stock Commit (official sync point): $STOCK_COMMIT"

          # Extract version info - anchored to the official sync point
          # (STOCK_COMMIT), i.e. the commit the linked manager is built from.
          # Mirrors pershoot c0a2c5fd: count the merge-base with origin, not
          # the fork's extra commits, so the version shown in the release
          # notes matches what the kernel reports and the manager displays.
          COMMITS_COUNT=$(git rev-list --count "$STOCK_COMMIT")
          BASE_VERSION=30000
          KSU_VERSION=$((COMMITS_COUNT + BASE_VERSION))

          # Extract git tag at the sync point
          KSU_GIT_TAG=$(git describe --tags --abbrev=0 "$STOCK_COMMIT" 2>/dev/null || echo "no-tag")

          MANAGER_RUN_ID=$(gh api "repos/KernelSU-Next/KernelSU-Next/actions/workflows/build-manager-ci.yml/runs?head_sha=${STOCK_COMMIT}" --jq '.workflow_runs[0].id // empty')
          if [[ -n "${MANAGER_RUN_ID:-}" ]]; then
            KSU_MANAGER="https://github.com/KernelSU-Next/KernelSU-Next/actions/runs/${MANAGER_RUN_ID}"
            KSU_MANAGER_NOTE="built from stock dev commit ${STOCK_COMMIT:0:12} (exact match)"
          else
            # Validated up-front in resolve-sources; a release cannot proceed without
            # the exact manager run. Fail rather than link a mismatched manager.
            echo "ERROR: exact manager build no longer available for ${STOCK_COMMIT}" >&2
            exit 1
          fi

          echo "Commits count: $COMMITS_COUNT"
          echo "KSU Version: $KSU_VERSION"
          echo "KSU Git Tag: $KSU_GIT_TAG"
          echo "KSU Manager: $KSU_MANAGER"

          # Exported for the release record; the notes themselves now come
          # from the single release-notes-preview artifact (built by the
          # notes-preview job from resolve-sources outputs).
          {
            echo "KSUN_BRANCH=$KSU_INPUT"
            echo "KSUN_COMMIT=$KSUN_COMMIT"
            echo "KSU_COMMITS_COUNT=$COMMITS_COUNT"
            echo "KSU_VERSION=$KSU_VERSION"
            echo "KSU_GIT_TAG=$KSU_GIT_TAG"
            echo "KSU_MANAGER=$KSU_MANAGER"
            echo "KSU_MANAGER_NOTE=${KSU_MANAGER_NOTE:-}"
            echo "MANAGER_RUN_ID=$MANAGER_RUN_ID"
          } >> "$GITHUB_ENV"

      - name: Download release notes (single source)
        uses: actions/download-artifact@v7
        with:
          name: release-notes-preview
          path: .

      - name: Verify release body is populated
        run: |
          set -euo pipefail
          # resolve-sources outputs silently expand to empty when the job
          # lacks it in `needs` (r20 shipped with _n/a_ everywhere). Fail
          # fast instead of publishing thin notes.
          if grep -q '_n/a_' release_body.md; then
            echo "ERROR: release_body.md contains unresolved _n/a_ entries:" >&2
            grep '_n/a_' release_body.md >&2
            exit 1
          fi
          if ! grep -qE "\[\`[0-9a-f]{7}\`\]" release_body.md; then
            echo "ERROR: release_body.md has no commit links" >&2
            exit 1
          fi
          echo "Release body OK ($(wc -l < release_body.md) lines)"

      - name: Download Manager APK zips
        uses: actions/download-artifact@v7
        with:
          path: release-assets/manager
          pattern: "*.apk"
          merge-multiple: true

      # NOTE: one download-artifact step per kernel family. A single
      # pattern ('*-AnyKernel3') silently truncates: run 34015449465
      # downloaded only 495/591 artifacts, so r20 shipped 500/596 assets.
      - name: Download AnyKernel3 (5.10 android12)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "5.10.*-android12-*-AnyKernel3"
          merge-multiple: false

      - name: Download AnyKernel3 (5.10 android13)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "5.10.*-android13-*-AnyKernel3"
          merge-multiple: false

      - name: Download AnyKernel3 (5.15 android13)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "5.15.*-android13-*-AnyKernel3"
          merge-multiple: false

      - name: Download AnyKernel3 (5.15 android14)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "5.15.*-android14-*-AnyKernel3"
          merge-multiple: false

      - name: Download AnyKernel3 (6.1 android14)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "6.1.*-android14-*-AnyKernel3"
          merge-multiple: false

      - name: Download AnyKernel3 (6.6 android15)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "6.6.*-android15-*-AnyKernel3"
          merge-multiple: false

      - name: Download AnyKernel3 (6.12 android16)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "6.12.*-android16-*-AnyKernel3"
          merge-multiple: false

      - name: Verify all AnyKernel3 artifacts downloaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Page the artifact list explicitly rather than with --paginate. On a
          # run this large --paginate has been observed to stop early (1129 of
          # 1229 artifacts), which silently undercounts the target.
          names=$(mktemp)
          for page in $(seq 1 50); do
            batch=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100&page=${page}" \
              --jq '.artifacts[].name' || true)
            [ -z "$batch" ] && break
            printf '%s\n' "$batch" >> "$names"
            count=$(printf '%s\n' "$batch" | grep -c . || true)
            [ "$count" -lt 100 ] && break
          done

          expected=$(grep -c '\-AnyKernel3$' "$names" || true)

          # download-artifact matches patterns server-side and, on a run with
          # ~1200 artifacts, silently skipped some while still reporting success
          # (run 36828639322: 496 of 609). Re-fetch anything it missed straight
          # from the API so a pattern-matching miss cannot produce a short
          # release.
          missing=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            if [ ! -d "release-assets/${name}" ]; then
              echo "Re-fetching missed artifact: $name"
              # The artifacts endpoint returns {"total_count":N,"artifacts":[...]},
              # NOT a bare array: '.[0]' threw "expected an array but got: object"
              # on every call, which is what made run 40835740313 record 139
              # re-fetch failures and abort the release with 482 of 621 downloaded.
              # Download through gh (not bare curl): the archive URL needs auth.
              artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=${name}" \
                --jq '.artifacts[0].id // empty' || true)
              if [ -z "$artifact_id" ] \
                || ! gh api "repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" > "release-assets/${name}.zip" 2>/dev/null; then
                echo "ERROR: failed to re-fetch $name" >&2
                missing=$((missing + 1))
              else
                mkdir -p "release-assets/${name}" && unzip -q -o "release-assets/${name}.zip" -d "release-assets/${name}"
                rm -f "release-assets/${name}.zip"
              fi
            fi
          done < <(grep '\-AnyKernel3$' "$names" || true)
          rm -f "$names"

          got=$(find release-assets -maxdepth 1 -type d -name "*-AnyKernel3" 2>/dev/null | wc -l)
          echo "AnyKernel3 artifacts in run: $expected, downloaded: $got, unrecoverable: $missing"
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: $missing AnyKernel3 artifacts could not be downloaded" >&2
            exit 1
          fi
          if [ "$got" -ne "$expected" ]; then
            echo "ERROR: downloaded $got of $expected AnyKernel3 artifacts" >&2
            exit 1
          fi

      - name: Download NoMount metamodule
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "*NoMount-Metamodule"
          merge-multiple: false

      - name: Zip AnyKernel3 for Release
        run: |
          set -e
          shopt -s nullglob

          for dir in release-assets/*-AnyKernel3; do
            zip_name="${dir}.zip"
            rm -f "$zip_name"
            cd "$dir"
            zip -r -q -9 "../$(basename "$zip_name")" .
            cd - >/dev/null
          done

      - name: Zip NoMount Metamodule for Release
        run: |
          set -e
          shopt -s nullglob

          for dir in release-assets/*NoMount-Metamodule; do
            zip_name="${dir}.zip"
            rm -f "$zip_name"
            cd "$dir"
            zip -r -q -9 "../$(basename "$zip_name")" .
            cd - >/dev/null
          done

      - name: Verify NoMount metamodule zip
        if: inputs.use_nomount
        run: |
          set -euo pipefail
          # The metamodule silently missed r20 (artifact built fine, no zip
          # on the release). Fail loud instead of shipping without it.
          if ! ls release-assets/NoMount-Metamodule.zip >/dev/null 2>&1; then
            echo "ERROR: use_nomount is true but release-assets/NoMount-Metamodule.zip is missing" >&2
            ls release-assets/ >&2
            exit 1
          fi
          echo "NoMount metamodule zip OK"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.new_tag }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.release_title }}
          IS_PRERELEASE: ${{ inputs.release_type == 'Pre-Release' }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          # Collect assets first so a glob miss fails fast instead of mid-release.
          files=(release-assets/**/*.zip release-assets/**/*.apk release-assets/**/*-boot*.img)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi
          echo "Uploading ${#files[@]} assets one at a time..."

          # The release may already exist (partial upload from a retried run,
          # or a concurrent run that computed the same tag). Refresh its notes
          # so a re-run heals stale bodies instead of leaving them behind.
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists — refreshing notes and uploading into it."
            gh release edit "$TAG_NAME" --notes-file release_body.md
          else
            create_args=(--title "$RELEASE_TITLE" --notes-file release_body.md)
            if [ "$IS_PRERELEASE" = "true" ]; then
              create_args+=(--prerelease)
            fi
            gh release create "$TAG_NAME" "${create_args[@]}"
          fi

          # Sequential uploads: one asset at a time with per-file retries.
          # (The previous single-step bulk upload fired ~500 concurrent
          # uploads and got the runner killed twice at the same point.)
          failed=0
          for f in "${files[@]}"; do
            ok=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG_NAME" "$f" --clobber; then
                ok=true
                break
              fi
              echo "Attempt $attempt/3 failed for: $f" >&2
              if [ "$attempt" -lt 3 ]; then
                sleep 10
              fi
            done
            if [ "$ok" = false ]; then
              echo "ERROR: giving up on $f" >&2
              failed=1
            fi
          done
          exit "$failed"

  notes-preview:
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_BUILDS == 'true'))
    needs: [resolve-sources, build-android12-5-10, build-android13-5-10, build-android13-5-15, build-android14-5-15, build-android14-6-1, build-android15-6-6, build-android16-6-12, build-android17-6-18]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render release notes preview (always)
        # Renderer lives in .github/scripts (extracted out of this workflow).
        uses: ./.github/actions/release-notes-preview
        with:
          mode: kernel
        env:
          ROOT_FLAVOR: ${{ inputs.root_flavor }}
          FEATURE_SET: ${{ needs.resolve-sources.outputs.feature_set }}
          MANAGER_LIST: ${{ needs.resolve-sources.outputs.manager_list }}
          ROOT_MATRIX: ${{ needs.resolve-sources.outputs.root_matrix }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
          USE_SUSFS: ${{ inputs.use_susfs || (github.event_name == 'schedule' && true) || false }}
          USE_NOMOUNT: ${{ inputs.use_nomount || (github.event_name == 'schedule' && true) || false }}
          USE_BBG: ${{ inputs.use_bbg || (github.event_name == 'schedule' && true) || false }}
          USE_DS: ${{ inputs.use_ds || (github.event_name == 'schedule' && true) || false }}
          USE_NET: ${{ inputs.use_net || (github.event_name == 'schedule' && true) || false }}
          USE_NTSYNC: ${{ inputs.use_ntsync || (github.event_name == 'schedule' && true) || false }}
          USE_PTRACE: ${{ inputs.use_ptrace || (github.event_name == 'schedule' && true) || false }}
          USE_UNICODE: ${{ inputs.use_unicode || (github.event_name == 'schedule' && true) || false }}
          USE_BPF: ${{ inputs.use_bpf || (github.event_name == 'schedule' && true) || false }}
          USE_PERF: ${{ inputs.use_perf || false }}
          PAGE_SIZE: ${{ inputs.page_size || '4k' }}
          KERNEL_BUILD_VERSION: ${{ inputs.kernel_build_version || 'All' }}
          NOMOUNT_COMMIT: ${{ needs.resolve-sources.outputs.nomount_commit }}
          KSU_COMMIT: ${{ needs.resolve-sources.outputs.ksu_commit }}
          BAKASU_COMMIT: ${{ needs.resolve-sources.outputs.bakasu_commit }}
          SUKISU_ULTRA_COMMIT: ${{ needs.resolve-sources.outputs.sukisu_ultra_commit }}
          FINASU_COMMIT: ${{ needs.resolve-sources.outputs.finasu_commit }}
          KOWSU_COMMIT: ${{ needs.resolve-sources.outputs.kowsu_commit }}
          KERNELSU_COMMIT: ${{ needs.resolve-sources.outputs.kernelsu_commit }}
          KERNEL_PATCHES_COMMIT: ${{ needs.resolve-sources.outputs.kernel_patches_commit }}
          ANYKERNEL3_COMMIT: ${{ needs.resolve-sources.outputs.anykernel3_commit }}
          DROIDSPACES_COMMIT: ${{ needs.resolve-sources.outputs.droidspaces_commit }}
          SUSFS_ANDROID12_5_10: ${{ needs.resolve-sources.outputs.susfs_commit_android12_5_10 }}
          SUSFS_ANDROID13_5_10: ${{ needs.resolve-sources.outputs.susfs_commit_android13_5_10 }}
          SUSFS_ANDROID13_5_15: ${{ needs.resolve-sources.outputs.susfs_commit_android13_5_15 }}
          SUSFS_ANDROID14_5_15: ${{ needs.resolve-sources.outputs.susfs_commit_android14_5_15 }}
          SUSFS_ANDROID14_6_1: ${{ needs.resolve-sources.outputs.susfs_commit_android14_6_1 }}
          SUSFS_ANDROID15_6_6: ${{ needs.resolve-sources.outputs.susfs_commit_android15_6_6 }}
          SUSFS_ANDROID16_6_12: ${{ needs.resolve-sources.outputs.susfs_commit_android16_6_12 }}
          SUSFS_ANDROID12_5_10_BAKASU: ${{ needs.resolve-sources.outputs.susfs_commit_android12_5_10_bakasu }}
          SUSFS_ANDROID13_5_10_BAKASU: ${{ needs.resolve-sources.outputs.susfs_commit_android13_5_10_bakasu }}
          SUSFS_ANDROID13_5_15_BAKASU: ${{ needs.resolve-sources.outputs.susfs_commit_android13_5_15_bakasu }}
          SUSFS_ANDROID14_5_15_BAKASU: ${{ needs.resolve-sources.outputs.susfs_commit_android14_5_15_bakasu }}
          SUSFS_ANDROID14_6_1_BAKASU: ${{ needs.resolve-sources.outputs.susfs_commit_android14_6_1_bakasu }}
          SUSFS_ANDROID15_6_6_BAKASU: ${{ needs.resolve-sources.outputs.susfs_commit_android15_6_6_bakasu }}
          SUSFS_ANDROID16_6_12_BAKASU: ${{ needs.resolve-sources.outputs.susfs_commit_android16_6_12_bakasu }}
          SUSFS_ANDROID12_5_10_SUKISU_ULTRA: ${{ needs.resolve-sources.outputs.susfs_commit_android12_5_10_sukisu_ultra }}
          SUSFS_ANDROID13_5_10_SUKISU_ULTRA: ${{ needs.resolve-sources.outputs.susfs_commit_android13_5_10_sukisu_ultra }}
          SUSFS_ANDROID13_5_15_SUKISU_ULTRA: ${{ needs.resolve-sources.outputs.susfs_commit_android13_5_15_sukisu_ultra }}
          SUSFS_ANDROID14_5_15_SUKISU_ULTRA: ${{ needs.resolve-sources.outputs.susfs_commit_android14_5_15_sukisu_ultra }}
          SUSFS_ANDROID14_6_1_SUKISU_ULTRA: ${{ needs.resolve-sources.outputs.susfs_commit_android14_6_1_sukisu_ultra }}
          SUSFS_ANDROID15_6_6_SUKISU_ULTRA: ${{ needs.resolve-sources.outputs.susfs_commit_android15_6_6_sukisu_ultra }}
          SUSFS_ANDROID16_6_12_SUKISU_ULTRA: ${{ needs.resolve-sources.outputs.susfs_commit_android16_6_12_sukisu_ultra }}
      - name: Upload release notes preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-preview
          path: release_body.md
          retention-days: 7
          if-no-files-found: warn

  nightly-release:
    # Do not recreate `nightly` from a failed run. `notes-preview` is
    # if: always() so a build failure still renders notes; without the
    # result check below that meant a failed resolve-sources would
    # delete the existing nightly tag and republish it from a body
    # rendered off empty/absent inputs.
    if: >-
      always() &&
      needs.resolve-sources.result == 'success' &&
      needs.notes-preview.result == 'success' &&
      (github.event_name == 'schedule' || inputs.release_type == 'Nightly')
    needs: [notes-preview, resolve-sources]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download release notes preview
        uses: actions/download-artifact@v7
        with:
          name: release-notes-preview
          path: nightly

      - name: Append nightly.link URL
        run: |
          {
            echo ""
            echo "- **Nightly artifacts:** https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Note:** kernels that built successfully this run are attached below; failed families are simply absent. The link above lists everything this run produced."
          } >> nightly/release_body.md
          cat nightly/release_body.md >> "$GITHUB_STEP_SUMMARY"

      # Publish-everything-that-built: download each family's AnyKernel3
      # artifacts and attach them to the nightly release. A family whose
      # builds all failed (or that was skipped) simply contributes nothing -
      # the release still publishes with whatever succeeded. One
      # download-artifact step per family, same as the release job: a single
      # broad pattern silently truncates on runs this large
      # (run 34015449465: 495/591 artifacts).
      - name: Download AnyKernel3 (5.10 android12)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '5.10.*-android12-*-AnyKernel3'
          merge-multiple: false

      - name: Download AnyKernel3 (5.10 android13)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '5.10.*-android13-*-AnyKernel3'
          merge-multiple: false

      - name: Download AnyKernel3 (5.15 android13)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '5.15.*-android13-*-AnyKernel3'
          merge-multiple: false

      - name: Download AnyKernel3 (5.15 android14)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '5.15.*-android14-*-AnyKernel3'
          merge-multiple: false

      - name: Download AnyKernel3 (6.1 android14)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '6.1.*-android14-*-AnyKernel3'
          merge-multiple: false

      - name: Download AnyKernel3 (6.6 android15)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '6.6.*-android15-*-AnyKernel3'
          merge-multiple: false

      - name: Download AnyKernel3 (6.12 android16)
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '6.12.*-android16-*-AnyKernel3'
          merge-multiple: false

      - name: Download NoMount metamodule
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: '*NoMount-Metamodule'
          merge-multiple: false

      - name: Zip artifacts for Release
        run: |
          set -e
          shopt -s nullglob
          for dir in release-assets/*-AnyKernel3 release-assets/*NoMount-Metamodule; do
            zip_name="${dir}.zip"
            rm -f "$zip_name"
            (cd "$dir" && zip -r -q -9 "../$(basename "$zip_name")" .)
          done
          find release-assets -maxdepth 1 -name "*.zip" 2>/dev/null | wc -l | xargs -I{} echo "{} zips ready"

      - name: Replace nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete nightly --cleanup-tag -y || true
          if git ls-remote --tags origin nightly | grep -q 'refs/tags/nightly'; then
            git push --delete origin nightly || true
          fi
          gh release create nightly \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Nightly (${{ github.ref_name }} $(date -u +%Y-%m-%d))" \
            --notes-file nightly/release_body.md

      # Sequential uploads with per-file retries, non-fatal per file: a
      # single failed asset must not unpublish the nightly (the kernels it
      # shipped are still valid for testers). Missing/failed counts land
      # in the step summary instead. This runs AFTER the release exists.
      - name: Upload kernel assets to nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release-assets/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No kernel artifacts this run; nightly published with notes only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Uploading ${#files[@]} kernel assets..." >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for f in "${files[@]}"; do
            ok=false
            for attempt in 1 2 3; do
              if gh release upload nightly "$f" --clobber; then
                ok=true
                break
              fi
              echo "Attempt $attempt/3 failed for: $(basename "$f")" >&2
              if [ "$attempt" -lt 3 ]; then sleep 10; fi
            done
            if [ "$ok" = false ]; then
              echo "ERROR: giving up on $(basename "$f")" >&2
              failed=$((failed + 1))
            fi
          done
          {
            echo ""
            echo "### Nightly assets"
            echo "- uploaded: $(( ${#files[@]} - failed )) / ${#files[@]}"
            if [ "$failed" -ne 0 ]; then
              echo "- failed uploads: $failed (see job log)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
