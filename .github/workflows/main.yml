name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        type: choice
        options:
          - CI
          - Pre-Release
          - Release
        default: CI
      allow_version_mismatch:
        description: "Force-load modules with mismatched symbol versions ( force check_version() to pass )"
        type: boolean
        default: false
      kernel_build_version:
        description: "Kernel Version"
        type: choice
        options:
          - All
          - 5.10.x-android12
          - 5.10.x-android13
          - 5.15.x-android13
          - 5.15.x-android14
          - 6.1.x-android14
          - 6.6.x-android15
          - 6.12.x-android16
          - 6.18.x-android17
        default: All
      os_patch_level:
        description: "Patch date (YYYY-MM), kernel sublevel, lts, or All (no filter)"
        required: true
        type: string
        default: All
      page_size:
        description: "ARM64 page size. 16k requires explicitly selecting Kernel Version 6.1.x-android14, 6.6.x-android15 or 6.12.x-android16 (All is rejected)"
        type: choice
        options:
          - 4k
          - 16k
        default: 4k
      brand_name:
        description: "Kernel Branding (empty = stock version string)"
        type: string
        default: Wild
      keep_kmi:
        description: "Keep stock KMI generation suffix in kernel version (fix #265)"
        type: boolean
        default: false
      commit_mode:
        description: "latest = branch tips, verified = audited pins"
        required: false
        type: choice
        options:
          - latest
          - verified
        default: verified
      root_flavor:
        description: "Root Flavor"
        type: choice
        options:
          - KernelSU-Next
          - KernelSU
          - BakaSU
          - SukiSU-Ultra
          - KowSU
          - FinaSU
          - No Root
          - All (KernelSU-Next + KernelSU + BakaSU)
        default: All (KernelSU-Next + KernelSU + BakaSU)
      use_susfs:
        description: "SUSFS"
        type: boolean
        default: true
      use_nomount:
        description: "NoMount"
        type: boolean
        default: true
      use_bbg:
        description: "Baseband Guard"
        type: boolean
        default: true
      use_net:
        description: "Networking"
        type: boolean
        default: true
      use_ds:
        description: "DroidSpaces"
        type: boolean
        default: true
      use_ntsync:
        description: "NTSync"
        type: boolean
        default: true
      use_ptrace:
        description: "Ptrace Patch"
        type: boolean
        default: true
      use_unicode:
        description: "Unicode Fix"
        type: boolean
        default: true
      use_bpf:
        description: "BPF Stack (BTF + eBPF + FUSE-BPF)"
        type: boolean
        default: true
      use_perf:
        description: "Performance"
        type: boolean
        default: false
      test_release_notes:
        description: "Render release notes preview only (skip all builds + release)"
        type: boolean
        default: false
  # schedule:  # nightly automatic builds disabled - user opt-in via workflow_dispatch only
  #   - cron: "0 5 * * 1" # Monday 12am EST (5am UTC)

jobs:
  # Fork gate (#328): scheduled (cron) runs only proceed when the repo sets
  # the Actions variable ENABLE_SCHEDULED_BUILDS=true. Forks don't copy
  # variables, so their inherited nightly+sync crons skip (no minutes burned);
  # workflow_dispatch is unaffected. Upstream sets the variable to 'true'.
  resolve-sources:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_BUILDS == 'true')
    runs-on: ubuntu-latest
    outputs:
      nomount_commit: ${{ steps.resolve.outputs.nomount_commit }}
      kernelsu_commit: ${{ steps.resolve.outputs.kernelsu_commit }}
      next_base_commit: ${{ steps.resolve.outputs.next_base_commit }}
      kernelsu_branch: ${{ steps.resolve.outputs.kernelsu_branch }}
      root_flavor: ${{ steps.resolve.outputs.root_flavor }}
      root_commit: ${{ steps.resolve.outputs.root_commit }}
      root_matrix: ${{ steps.resolve.outputs.root_matrix }}
      susfs_commit_android12_5_10: ${{ steps.resolve.outputs.susfs_commit_android12_5_10 }}
      susfs_commit_android13_5_10: ${{ steps.resolve.outputs.susfs_commit_android13_5_10 }}
      susfs_commit_android13_5_15: ${{ steps.resolve.outputs.susfs_commit_android13_5_15 }}
      susfs_commit_android14_5_15: ${{ steps.resolve.outputs.susfs_commit_android14_5_15 }}
      susfs_commit_android14_6_1: ${{ steps.resolve.outputs.susfs_commit_android14_6_1 }}
      susfs_commit_android15_6_6: ${{ steps.resolve.outputs.susfs_commit_android15_6_6 }}
      susfs_commit_android16_6_12: ${{ steps.resolve.outputs.susfs_commit_android16_6_12 }}
      susfs_commit_android12_5_10_bakasu: ${{ steps.resolve.outputs.susfs_commit_android12_5_10_bakasu }}
      susfs_commit_android13_5_10_bakasu: ${{ steps.resolve.outputs.susfs_commit_android13_5_10_bakasu }}
      susfs_commit_android13_5_15_bakasu: ${{ steps.resolve.outputs.susfs_commit_android13_5_15_bakasu }}
      susfs_commit_android14_5_15_bakasu: ${{ steps.resolve.outputs.susfs_commit_android14_5_15_bakasu }}
      susfs_commit_android14_6_1_bakasu: ${{ steps.resolve.outputs.susfs_commit_android14_6_1_bakasu }}
      susfs_commit_android15_6_6_bakasu: ${{ steps.resolve.outputs.susfs_commit_android15_6_6_bakasu }}
      susfs_commit_android16_6_12_bakasu: ${{ steps.resolve.outputs.susfs_commit_android16_6_12_bakasu }}
      susfs_commit_android12_5_10_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android12_5_10_sukisu_ultra }}
      susfs_commit_android13_5_10_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android13_5_10_sukisu_ultra }}
      susfs_commit_android13_5_15_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android13_5_15_sukisu_ultra }}
      susfs_commit_android14_5_15_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android14_5_15_sukisu_ultra }}
      susfs_commit_android14_6_1_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android14_6_1_sukisu_ultra }}
      susfs_commit_android15_6_6_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android15_6_6_sukisu_ultra }}
      susfs_commit_android16_6_12_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android16_6_12_sukisu_ultra }}
      ksu_commit: ${{ steps.resolve.outputs.ksu_commit }}
      bakasu_commit: ${{ steps.resolve.outputs.bakasu_commit }}
      sukisu_ultra_commit: ${{ steps.resolve.outputs.sukisu_ultra_commit }}
      finasu_commit: ${{ steps.resolve.outputs.finasu_commit }}
      kowsu_commit: ${{ steps.resolve.outputs.kowsu_commit }}
      kernel_patches_commit: ${{ steps.resolve.outputs.kernel_patches_commit }}
      anykernel3_commit: ${{ steps.resolve.outputs.anykernel3_commit }}
      droidspaces_commit: ${{ steps.resolve.outputs.droidspaces_commit }}
      feature_set: ${{ steps.features.outputs.feature_set }}
      manager_list: ${{ steps.manager.outputs.manager_list }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate page size selection
        shell: bash
        run: |
          set -euo pipefail
          # Scheduled (nightly) runs carry no inputs; default them the same
          # as the workflow_dispatch defaults below.
          PAGE_SIZE="${{ inputs.page_size || '4k' }}"
          KVER="${{ inputs.kernel_build_version || 'All' }}"
          [ "$PAGE_SIZE" = "16k" ] || exit 0
          # Only these GKI families use a Kleaf build branch exposing
          # --page_size (main-kernel-build-2023/2024, main-kernel-2025).
          case "$KVER" in
            6.1.x-android14|6.6.x-android15|6.12.x-android16) ;;
            *)
              echo "ERROR: page_size=16k requires kernel_build_version to be one of:" >&2
              echo "  6.1.x-android14, 6.6.x-android15, 6.12.x-android16" >&2
              echo "Got: '${KVER}'." >&2
              exit 1
              ;;
          esac

      - name: Resolve latest component commits
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          # Commit resolution mode. 'latest' (default) resolves branch tips at
          # run time via git ls-remote. 'verified' uses the audited pins below for
          # NoMount, kernelsu/bakasu roots, and SUSFS; KernelSU-Next stays latest.
          # Scheduled (nightly) runs use latest by default.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            COMMIT_MODE="${{ inputs.commit_mode || 'latest' }}"
          else
            COMMIT_MODE="${{ inputs.commit_mode || 'verified' }}"
          fi
          echo "commit_mode=${COMMIT_MODE}"

          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          resolve_sha() { # repo ref
            retry git ls-remote "$1" "$2" | awk '{print $1; exit}'
          }

          emit() { # key value
            if [ -z "$2" ] || ! [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Failed to resolve $1 (got: ${2:-empty})" >&2
              exit 1
            fi
            echo "$1=$2" >> "$GITHUB_OUTPUT"
          }

          # Audited pins. Used only when commit_mode=verified.
          # Refreshed 2026-11-02 to each upstream branch tip.
          # NoMount is deliberately NOT pinned: it is a module-side component
          # with no kernel contract, so it always tracks the dev tip even in
          # verified mode (see the nomount_commit emit below).
          # KernelSU: official main tip (28db74f6, 2026-11-01, "kernel: Fix
          # SELinux generation tracking for policy updates (#3964)").
          PIN_KERNELSU="dbb73665d103da40c7ecbd21ba3b5ac76eb95784"
          # BakaSU: official main tip (516d3e87, 2026-10-31, "ksuinit: make lint
          # check happy"). Still tracks latest despite the fa12ffd fake_state
          # removal - the 5 older branches (12-5.10/13-5.10/13-5.15/14-5.15/
          # 14-6.1) fs patches reference `fake_state` and will fail to link with
          # latest BakaSU; 6.6/6.12/6.18 are unaffected. Watch those 5 families.
          PIN_BAKASU="548d1dda060ca198823d8808804d01f5209ef4a9"
          # SukiSU-Ultra: builtin tip (1cfa5734, 2026-10-31); defines fake_state
          # itself and calls the susfs_def.h no_su API -> OK on tips. Note the
          # repo's default branch (main, b8bd4b6c) is used only for SUSFS-off
          # builds, which resolve it at run time rather than from this pin.
          PIN_SUKISU_ULTRA="f9aa2fec23c3f4a06a935f69dc04cb85b261e7f3"
          # FinaSU: susfs-integrated fork of the tiann restructure; pin tracks
          # the susfs4ksu v2.3 ABI era its supercall dispatch is written against.
          # master tip 2d5786b9 (2026-11-01, "susfs: Separate provider and
          # operation state").
          PIN_FINASU="14a71d953a09e0d706426a17be0f4b422893ab26"
          # SUSFS (gitlab simonpunk/susfs4ksu): every gki-<family> branch moved
          # one commit, "KernelSU: Fix compiler error" (2026-10-30) - a compile
          # fix for newer KernelSU headers, no new config symbol, no ABI change.
          # The previous refresh (2026-10-27) added the priority uid filter
          # ("susfs: Add priority uid filter" + its "Fix UAF bugs and worker not
          # able to run" follow-up), guarded by CONFIG_KSU_SUSFS only;
          # susfs_is_priority_uid_filtered() lives in fs/susfs.c, so the config
          # list still needs no change.
          declare -A PIN_SUSFS=(
            [susfs_commit_android12_5_10]="5436438b5cc77f146e04f71070da153dabe17a9d"
            [susfs_commit_android13_5_10]="1bea9e8fb4a64920f068e5da43f9751dfe601199"
            [susfs_commit_android13_5_15]="fe943d15ec6a1891f7a360bf210589bdffe4e318"
            [susfs_commit_android14_5_15]="10751e3c83f6e63f886cd2af937fd0a34463824b"
            [susfs_commit_android14_6_1]="69b8e734920b8f9ed885ab8d112969719698e242"
            [susfs_commit_android15_6_6]="ec03d0c73b821afa1d5037d6d493216f59744fcb"
            [susfs_commit_android16_6_12]="395a8c0c88d348e9fe7c14f66a456fde4653287c"
          )
          # BakaSU keeps its own SUSFS pin set (kept separate so it can diverge
          # again). Values = the same verified branch tips as PIN_SUSFS.
          declare -A PIN_SUSFS_BAKASU=(
            [susfs_commit_android12_5_10]="5436438b5cc77f146e04f71070da153dabe17a9d"
            [susfs_commit_android13_5_10]="1bea9e8fb4a64920f068e5da43f9751dfe601199"
            [susfs_commit_android13_5_15]="fe943d15ec6a1891f7a360bf210589bdffe4e318"
            [susfs_commit_android14_5_15]="10751e3c83f6e63f886cd2af937fd0a34463824b"
            [susfs_commit_android14_6_1]="69b8e734920b8f9ed885ab8d112969719698e242"
            [susfs_commit_android15_6_6]="ec03d0c73b821afa1d5037d6d493216f59744fcb"
            [susfs_commit_android16_6_12]="395a8c0c88d348e9fe7c14f66a456fde4653287c"
          )
          # SukiSU-Ultra keeps its own SUSFS pin set too (same starting values).
          declare -A PIN_SUSFS_SUKISU_ULTRA=(
            [susfs_commit_android12_5_10]="5436438b5cc77f146e04f71070da153dabe17a9d"
            [susfs_commit_android13_5_10]="1bea9e8fb4a64920f068e5da43f9751dfe601199"
            [susfs_commit_android13_5_15]="fe943d15ec6a1891f7a360bf210589bdffe4e318"
            [susfs_commit_android14_5_15]="10751e3c83f6e63f886cd2af937fd0a34463824b"
            [susfs_commit_android14_6_1]="69b8e734920b8f9ed885ab8d112969719698e242"
            [susfs_commit_android15_6_6]="ec03d0c73b821afa1d5037d6d493216f59744fcb"
            [susfs_commit_android16_6_12]="395a8c0c88d348e9fe7c14f66a456fde4653287c"
          )

          pick() { # pinned repo ref  -> pinned when verified, else latest
            local pinned="$1" repo="$2" ref="$3"
            if [ "$COMMIT_MODE" = "verified" ] && [ -n "$pinned" ]; then
              echo "$pinned"
            else
              resolve_sha "$repo" "$ref"
            fi
          }

          # NoMount (pinned in verified mode, else dev tip)
          # NoMount always tracks the dev tip - never pinned, in either mode.
          emit nomount_commit "$(resolve_sha https://github.com/maxsteeel/nomount.git refs/heads/dev)"

          # KernelSU-Next manager - always built from the official repo's dev branch.
          # pershoot's fork is used only for the kernel SUSFS integration (root_commit below),
          # never for the manager. Manager always builds at latest.
          emit kernelsu_commit "$(resolve_sha https://github.com/KernelSU-Next/KernelSU-Next.git refs/heads/dev)"
          echo "kernelsu_branch=dev" >> "$GITHUB_OUTPUT"

          # Selected root implementation(s). Maps the human-facing choice
          # (KernelSU-Next / KernelSU / BakaSU / SukiSU-Ultra / KowSU /
          # No Root / All) to internal root-setup flavors (next / kernelsu /
          # bakasu / sukisu-ultra / kowsu / none). 'All' emits a matrix of
          # the three core root flavors plus each pinned commit; SukiSU-Ultra,
          # KowSU, and No Root are opt-in only and never part of 'All'.
          #
          # kernelsu, bakasu, and sukisu-ultra pin in verified mode;
          # KernelSU-Next (next) always builds at latest.
          # With SUSFS off, every root tracks latest instead of pins:
          # SukiSU-Ultra follows main (builtin only matters for SUSFS builds).
          # Scheduled runs default SUSFS on (all features on, see the
          # feature_set computation) - a nightly is a full-featured build.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCHED_SUSFS=true
          else
            SCHED_SUSFS="${{ inputs.use_susfs }}"
          fi
          if [ "$SCHED_SUSFS" = "true" ]; then
            KERNELSU_COMMIT="$(pick "$PIN_KERNELSU" https://github.com/tiann/KernelSU.git refs/heads/main)"
            BAKASU_COMMIT="$(pick "$PIN_BAKASU" https://github.com/Baka-SU/BakaSU.git refs/heads/main)"
            SUKISU_ULTRA_COMMIT="$(pick "$PIN_SUKISU_ULTRA" https://github.com/SukiSU-Ultra/SukiSU-Ultra.git refs/heads/builtin)"
            FINASU_COMMIT="$(pick "$PIN_FINASU" https://github.com/LyraVoid/FinaSU.git refs/heads/master)"
          else
            KERNELSU_COMMIT="$(resolve_sha https://github.com/tiann/KernelSU.git refs/heads/main)"
            BAKASU_COMMIT="$(resolve_sha https://github.com/Baka-SU/BakaSU.git refs/heads/main)"
            SUKISU_ULTRA_COMMIT="$(resolve_sha https://github.com/SukiSU-Ultra/SukiSU-Ultra.git refs/heads/main)"
            FINASU_COMMIT="$(resolve_sha https://github.com/LyraVoid/FinaSU.git refs/heads/master)"
          fi
          emit ksu_commit "$KERNELSU_COMMIT"
          emit bakasu_commit "$BAKASU_COMMIT"
          emit sukisu_ultra_commit "$SUKISU_ULTRA_COMMIT"
          # FinaSU ships susfs kernel-side and hard-depends on it (unguarded
          # linux/susfs.h includes), so it is only valid with SUSFS on;
          # susfs-off finasu builds are rejected in build.yml.
          emit finasu_commit "$FINASU_COMMIT"
          # KowSU has no SUSFS support, so it always tracks latest on master
          # (it can only ever run with SUSFS off — enforced below).
          KOWSU_COMMIT="$(resolve_sha https://github.com/KOWX712/KernelSU.git refs/heads/master)"
          emit kowsu_commit "$KOWSU_COMMIT"
          if [ "$SCHED_SUSFS" = "true" ]; then
            NEXT_COMMIT="$(resolve_sha https://github.com/pershoot/KernelSU-Next.git refs/heads/dev-susfs)"
          else
            NEXT_COMMIT="$(resolve_sha https://github.com/KernelSU-Next/KernelSU-Next.git refs/heads/dev)"
          fi

          # The kernel reports 30000 + count(merge-base(KSU HEAD, upstream dev))
          # -- see .github/actions/root-setup. The manager has to be resolved at
          # that same upstream commit, not at the fork tip: the fork tip is a
          # fork-only SHA with no manager CI behind it, and pairing a manager
          # from a different commit is what let a kernel reporting 33405 sit
          # next to a manager reporting 33442.
          if [ "$SCHED_SUSFS" = "true" ]; then
            # Compare within the fork first: pershoot mirrors upstream dev, and
            # the path needs no owner:branch colon. Across-repo compare is the
            # fallback. curl with an explicit token on purpose -- `gh` is not
            # authenticated inside this job, which silently yielded an empty
            # base on run 41005208268 and left the pairing to the fallback.
            NEXT_BASE=""
            for cmp_url in \
              "https://api.github.com/repos/pershoot/KernelSU-Next/compare/dev...dev-susfs" \
              "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/compare/dev...pershoot:dev-susfs"; do
              NEXT_BASE="$(curl -fsSL --max-time 30 --retry 3 \
                -H "Authorization: Bearer ${{ github.token }}" \
                -H "Accept: application/vnd.github+json" \
                "$cmp_url" 2>/dev/null | jq -r '.merge_base_commit.sha // empty' 2>/dev/null || true)"
              [[ "${NEXT_BASE:-}" =~ ^[0-9a-f]{40}$ ]] && break
              NEXT_BASE=""
            done
            if [ -z "$NEXT_BASE" ]; then
              echo "WARNING: could not resolve the pershoot dev-susfs merge base; manager tracks the fork tip" >&2
              NEXT_BASE="$NEXT_COMMIT"
            else
              echo "[+] KernelSU-Next manager base ${NEXT_BASE:0:12} (merge-base with upstream dev)"
            fi
          else
            NEXT_BASE="$NEXT_COMMIT"
          fi
          emit next_base_commit "$NEXT_BASE"

          mk_entry() { # flavor variant commit produce
            printf '{"root_flavor":"%s","variant":"%s","root_commit":"%s","produce":%s}' "$1" "$2" "$3" "$4"
          }

          # On 'schedule' there are no inputs, so the default must be the exact
          # label the "All" arm matches below — a bare 'All' fell through to *)
          # and failed the whole job, yet the manager step's All* glob still
          # matched, so the two steps disagreed. Keep these in sync.
          case "${{ inputs.root_flavor || 'All (KernelSU-Next + KernelSU + BakaSU)' }}" in
            KernelSU)
              echo "root_flavor=kernelsu" >> "$GITHUB_OUTPUT"
              emit root_commit "$KERNELSU_COMMIT"
              ROOT_MATRIX="[$(mk_entry kernelsu KernelSU "$KERNELSU_COMMIT" true)]"
              ;;
            KernelSU-Next)
              echo "root_flavor=next" >> "$GITHUB_OUTPUT"
              emit root_commit "$NEXT_COMMIT"
              ROOT_MATRIX="[$(mk_entry next KernelSU-Next "$NEXT_COMMIT" true)]"
              ;;
            BakaSU)
              echo "root_flavor=bakasu" >> "$GITHUB_OUTPUT"
              emit root_commit "$BAKASU_COMMIT"
              ROOT_MATRIX="[$(mk_entry bakasu BakaSU "$BAKASU_COMMIT" true)]"
              ;;
            SukiSU-Ultra)
              echo "root_flavor=sukisu-ultra" >> "$GITHUB_OUTPUT"
              emit root_commit "$SUKISU_ULTRA_COMMIT"
              ROOT_MATRIX="[$(mk_entry sukisu-ultra SukiSU-Ultra "$SUKISU_ULTRA_COMMIT" true)]"
              ;;
            FinaSU)
              if [ "${{ inputs.use_susfs }}" = "false" ]; then
                echo "ERROR: FinaSU requires SUSFS — re-run with SUSFS on." >&2
                exit 1
              fi
              echo "root_flavor=finasu" >> "$GITHUB_OUTPUT"
              emit root_commit "$FINASU_COMMIT"
              ROOT_MATRIX="[$(mk_entry finasu FinaSU "$FINASU_COMMIT" true)]"
              ;;
            KowSU)
              if [ "${{ inputs.use_susfs }}" = "true" ]; then
                echo "ERROR: KowSU does not work together with SUSFS — re-run with SUSFS off." >&2
                exit 1
              fi
              echo "root_flavor=kowsu" >> "$GITHUB_OUTPUT"
              emit root_commit "$KOWSU_COMMIT"
              ROOT_MATRIX="[$(mk_entry kowsu KowSU "$KOWSU_COMMIT" true)]"
              ;;
            "No Root")
              echo "root_flavor=none" >> "$GITHUB_OUTPUT"
              echo "root_commit=" >> "$GITHUB_OUTPUT"
              ROOT_MATRIX='[{"root_flavor":"none","variant":"NoRoot","root_commit":""}]'
              ROOT_MATRIX="[$(mk_entry none NoRoot "" true)]"
              ;;
            "All (KernelSU-Next + KernelSU + BakaSU)")
              # Fan out to all three root variants, each with its pinned commit.
              ROOT_MATRIX="[$(mk_entry next KernelSU-Next "$NEXT_COMMIT" true),$(mk_entry kernelsu KernelSU "$KERNELSU_COMMIT" false),$(mk_entry bakasu BakaSU "$BAKASU_COMMIT" false)]"
              echo "root_flavor=" >> "$GITHUB_OUTPUT"
              echo "root_commit=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: unknown root_flavor '${{ inputs.root_flavor }}'" >&2
              exit 1
              ;;
          esac
          echo "root_matrix=$ROOT_MATRIX" >> "$GITHUB_OUTPUT"

          # SUSFS per supported Android/kernel branch (gitlab simonpunk/susfs4ksu).
          # Always emit the verified pinned SHA here; build.yml overrides to the
          # latest branch tip per-variant when the root flavor is KernelSU-Next.
          declare -A SUSFS_BRANCHES=(
            [susfs_commit_android12_5_10]="gki-android12-5.10"
            [susfs_commit_android13_5_10]="gki-android13-5.10"
            [susfs_commit_android13_5_15]="gki-android13-5.15"
            [susfs_commit_android14_5_15]="gki-android14-5.15"
            [susfs_commit_android14_6_1]="gki-android14-6.1"
            [susfs_commit_android15_6_6]="gki-android15-6.6"
            [susfs_commit_android16_6_12]="gki-android16-6.12"
          )
          for key in "${!SUSFS_BRANCHES[@]}"; do
            emit "$key" "$(pick "${PIN_SUSFS[$key]}" https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/"${SUSFS_BRANCHES[$key]}")"
            # Per-flavor BakaSU SUSFS pin (same branch, own pin set).
            emit "${key}_bakasu" "$(pick "${PIN_SUSFS_BAKASU[$key]}" https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/"${SUSFS_BRANCHES[$key]}")"
            # Per-flavor SukiSU-Ultra SUSFS pin (same branch, own pin set).
            emit "${key}_sukisu_ultra" "$(pick "${PIN_SUSFS_SUKISU_ULTRA[$key]}" https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/"${SUSFS_BRANCHES[$key]}")"
          done

          # Tracked build helpers (resolved automatically, before the run)
          emit kernel_patches_commit "$(resolve_sha https://github.com/WildKernels/kernel_patches.git refs/heads/main)"
          emit anykernel3_commit   "$(resolve_sha https://github.com/WildKernels/AnyKernel3.git refs/heads/gki-2.0)"
          emit droidspaces_commit  "$(resolve_sha https://github.com/ravindu644/Droidspaces-OSS.git refs/heads/main)"

          echo "Resolved:"
          env | grep -E '^(nomount_commit|kernelsu_commit|kernelsu_branch|root_commit|susfs_commit_|kernel_patches_commit|anykernel3_commit|droidspaces_commit)' | sort || true

      - name: Resolve manager builds for selected root flavor(s)
        id: manager
        # Shared implementation for both the build pipeline (main.yml) and the
        # APK pipeline (managers.yml): .github/actions/resolve-managers.
        uses: ./.github/actions/resolve-managers
        with:
          root_flavor: ${{ inputs.root_flavor }}
          all_flavors: next,kernelsu,bakasu
          allow_fallback: 'true'
          root_matrix: ${{ steps.resolve.outputs.root_matrix }}
          next_commit: ${{ steps.resolve.outputs.next_base_commit }}
          finasu_commit: ${{ steps.resolve.outputs.finasu_commit }}

      - name: Compose requested feature set
        id: features
        shell: bash
        run: |
          set -euo pipefail

          # Root is optional now ('No Root' builds ship no root implementation),
          # so SUSFS on a No Root build applies kernel-side only.

          # A Release/Pre-Release ships whichever manger build(s) were resolved
          # in the manager step above (exact match per root flavor). No root
          # restriction applies here anymore -- KernelSU-Next, KernelSU, BakaSU,
          # SukiSU-Ultra, KowSU, FinaSU, or 'All' are all valid release targets ('No Root'
          # ships no manager).

          # Scheduled (nightly) runs carry NO inputs - the use_* booleans are
          # empty strings, not true - so read them with schedule defaults:
          # every feature ON (matching the dispatch defaults) except Perf,
          # which is opt-in on dispatch and stays off for nightlies.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            F_SUSFS=true;  F_NOMOUNT=true; F_BBG=true;  F_NET=true
            F_DS=true;     F_NTSYNC=true;  F_PTRACE=true; F_UNICODE=true
            F_BPF=true;    F_PERF=false
          else
            F_SUSFS="${{ inputs.use_susfs }}";   F_NOMOUNT="${{ inputs.use_nomount }}"
            F_BBG="${{ inputs.use_bbg }}";        F_NET="${{ inputs.use_net }}"
            F_DS="${{ inputs.use_ds }}";          F_NTSYNC="${{ inputs.use_ntsync }}"
            F_PTRACE="${{ inputs.use_ptrace }}";  F_UNICODE="${{ inputs.use_unicode }}"
            F_BPF="${{ inputs.use_bpf }}";        F_PERF="${{ inputs.use_perf }}"
          fi

          FEATURES=""
          [ "$F_SUSFS" = "true" ] && FEATURES="${FEATURES}SUSFS+"
          [ "$F_NOMOUNT" = "true" ] && FEATURES="${FEATURES}NoMount+"
          [ "$F_BBG" = "true" ] && FEATURES="${FEATURES}BBG+"
          [ "$F_NET" = "true" ] && FEATURES="${FEATURES}NET+"
          [ "$F_DS" = "true" ] && FEATURES="${FEATURES}DS+"
          [ "$F_NTSYNC" = "true" ] && FEATURES="${FEATURES}NTSync+"
          [ "$F_PTRACE" = "true" ] && FEATURES="${FEATURES}Ptrace+"
          [ "$F_UNICODE" = "true" ] && FEATURES="${FEATURES}Unicode+"
          [ "$F_BPF" = "true" ] && FEATURES="${FEATURES}BPF+"
          [ "$F_PERF" = "true" ] && FEATURES="${FEATURES}Perf+"
          echo "feature_set=${FEATURES%+}" >> "$GITHUB_OUTPUT"

      - name: Clone shared source repos once
        if: inputs.use_nomount && !inputs.test_release_notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources

          # NoMount kernel sources at the resolved commit (pinned or dev tip)
          git clone --no-checkout https://github.com/maxsteeel/nomount.git sources/nomount
          git -C sources/nomount fetch --depth=1 origin "${{ steps.resolve.outputs.nomount_commit }}"
          git -C sources/nomount checkout --detach "${{ steps.resolve.outputs.nomount_commit }}"
          [ "$(git -C sources/nomount rev-parse HEAD)" = "${{ steps.resolve.outputs.nomount_commit }}" ] || \
            { echo "NoMount clone HEAD mismatch" >&2; exit 1; }

  list-manager-apks:
    needs: resolve-sources
    if: "github.event_name == 'workflow_dispatch' && !inputs.test_release_notes && needs.resolve-sources.outputs.manager_list != ''"
    runs-on: ubuntu-latest
    outputs:
      apk_list: ${{ steps.scan.outputs.apk_list }}
    steps:
      - uses: actions/checkout@v7

      - name: Download and scan all manager APKs
        id: scan
        uses: ./.github/actions/list-manager-apks
        with:
          manager_list: ${{ needs.resolve-sources.outputs.manager_list }}

      - name: Upload all manager APKs as one cross-blob
        uses: actions/upload-artifact@v7
        with:
          name: manager-apks
          path: manager_apks/
          if-no-files-found: warn

  publish-manager-artifacts:
    needs: list-manager-apks
    if: "github.event_name == 'workflow_dispatch' && !inputs.test_release_notes && needs.list-manager-apks.outputs.apk_list != '[]'"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.list-manager-apks.outputs.apk_list) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download manager cross-blob
        uses: actions/download-artifact@v7
        with:
          name: manager-apks
          path: manager_apks
          merge-multiple: true

      - name: Upload ${{ matrix.item.apk }} as its own artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.item.apk }}
          path: manager_apks/${{ matrix.item.apk }}
          if-no-files-found: error

  build-nomount-module:
    needs: resolve-sources
    # Scheduled (nightly) runs carry NO inputs at all - inputs.use_nomount is
    # empty, not true - so the inner steps' `if: inputs.use_nomount` gates
    # would skip everything and produce no metamodule artifact. Compute the
    # effective flag once here and have the steps key off the job-level
    # env instead of the raw input.
    if: "(github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && !inputs.test_release_notes"
    env:
      NOMOUNT_WANTED: ${{ inputs.use_nomount || (github.event_name == 'schedule' && true) || false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: env.NOMOUNT_WANTED == 'true'

      - name: Clone NoMount source at pinned commit
        id: clone
        if: env.NOMOUNT_WANTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="${{ needs.resolve-sources.outputs.nomount_commit }}"
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "NoMount commit must be a full 40-character SHA." >&2
            exit 2
          fi
          echo "NoMount commit: ${COMMIT}"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Build NoMount metamodule (nm only, no .ko)
        if: env.NOMOUNT_WANTED == 'true'
        id: buildmod
        uses: ./.github/actions/nomount-metamodule
        with:
          commit: ${{ steps.clone.outputs.commit }}

      - name: Upload NoMount metamodule
        if: env.NOMOUNT_WANTED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: NoMount-Metamodule
          path: ${{ steps.buildmod.outputs.module_dir }}
          if-no-files-found: error
          compression-level: 0

